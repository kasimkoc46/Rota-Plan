name: Build RotaPlan APK

on:
  workflow_dispatch:
  push:
    paths:
      - "RotaPlan_AndroidIDE_Duzeltilmis_duzeltilmis.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q RotaPlan_AndroidIDE_Duzeltilmis_duzeltilmis.zip -d project
          rm -f project/gradle/wrapper/gradle-wrapper.jar
          rm -f project/gradlew project/gradlew.bat

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RotaPlan-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
